name: WeDoCalc visual preview
on:
  push:
    branches: [work/home-visual-v1]
permissions:
  contents: read
concurrency:
  group: wedocalc-home-preview
  cancel-in-progress: true
jobs:
  preview:
    if: github.ref == 'refs/heads/work/home-visual-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b81896777d206a2239625d9cf2e8a40b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find existing Pages project and protect production
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw new Error('Missing repository secret CLOUDFLARE_API_TOKEN.');
          async function api(path) {
            const response = await fetch('https://api.cloudflare.com/client/v4' + path, {
              headers: { Authorization: 'Bearer ' + token }
            });
            const data = await response.json();
            if (!response.ok || !data.success) throw new Error('Cloudflare API request failed at ' + path + '; codes: ' + (data.errors || []).map(e => e.code).join(','));
            return data.result;
          }
          let account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!account) {
            let accounts;
            try { accounts = await api('/accounts?per_page=50'); }
            catch { throw new Error('Set CLOUDFLARE_ACCOUNT_ID as a repository variable. The token cannot list accounts.'); }
            const matches = [];
            for (const item of accounts) {
              try {
                const project = await api('/accounts/' + item.id + '/pages/projects/wedocalc');
                if (project.name === 'wedocalc') matches.push(item.id);
              } catch {}
            }
            if (matches.length !== 1) throw new Error('Cannot uniquely identify wedocalc. Set repository variable CLOUDFLARE_ACCOUNT_ID.');
            account = matches[0];
          }
          if (!/^[a-f0-9]{32}$/i.test(account)) throw new Error('Invalid CLOUDFLARE_ACCOUNT_ID.');
          const project = await api('/accounts/' + account + '/pages/projects/wedocalc');
          if (project.production_branch !== 'main') throw new Error('Production branch differs from main; deployment stopped.');
          if (project.subdomain !== 'wedocalc.pages.dev') throw new Error('Unexpected Pages project; deployment stopped.');
          appendFileSync(process.env.GITHUB_ENV, 'CLOUDFLARE_ACCOUNT_ID=' + account + '\n');
          console.log('Verified existing wedocalc project; main remains production. Deploying preview branch only.');
          NODE
      - name: Prepare static files
        run: |
          mkdir -p preview-dist
          cp index.html preview-dist/
          cp -R css assets preview-dist/
          cp -R home-garden paint-calculators paint-calculator preview-dist/
      - name: Deploy preview only
        run: npx --yes wrangler@4 pages deploy preview-dist --project-name wedocalc --branch work/home-visual-v1 --commit-hash "$GITHUB_SHA"
      - name: Record preview
        run: |
          echo 'Preview branch: work/home-visual-v1. Production main was not deployed.' >> "$GITHUB_STEP_SUMMARY"
