name: Home Improvement route registry targeted repair
on:
  push:
    branches: [work/hi-route-registry-20261120]
    paths: [".github/workflows/hi-route-registry-repair.yml"]
permissions: {}
jobs:
  repair:
    if: github.event.head_commit.message == '[hi-route-repair-approved] Repair Home Improvement Room and Ceiling routes'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Add two missing calculator routes without changing the validator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const token=process.env.CLOUDFLARE_API_TOKEN;
          assert.ok(token,'Existing repository credential unavailable');
          const account='b81896777d206a2239625d9cf2e8a40b';
          const db='4674c99c-cb26-47af-a557-19f097678ec6';
          async function req(path,body){
            const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(12_000)});
            assert.ok(response.ok,'Cloudflare HTTP '+response.status);
            const {success,result}=await response.json();
            assert.ok(success,'Cloudflare operation not successful');
            return result;
          }
          const worker=await req('/workers/scripts/homeimprovement-editorial/settings');
          const bindings=worker.bindings.filter(b=>b.type==='d1'&&b.name==='DB');
          assert.ok(bindings.length===1&&(bindings[0].id??bindings[0].database_id)===db,'Production DB binding mismatch');
          const pages=await req('/pages/projects/homeimprovement-tools');
          assert.equal(pages?.deployment_configs?.production?.d1_databases?.DB?.id,db,'Pages production DB binding mismatch');
          const meta=await req('/d1/database/'+db);
          assert.equal(meta.name,'homeimprovement-editorial-db','Unexpected database');
          const path='/d1/database/'+db+'/query';
          const readSql="SELECT id,kind,name,path,parent_id,state FROM routes WHERE id IN ('paint-calculators','room-paint-calculator','ceiling-paint-calculator') OR RTRIM(path,'/') IN ('/room-paint-calculator','/ceiling-paint-calculator') ORDER BY id";
          async function read(){
            const q=await req(path,{sql:readSql});
            assert.equal(q[0]?.success,true,'Read failed');
            return q[0].results;
          }
          const parent={id:'paint-calculators',kind:'subcategory',name:'Paint Calculators',path:'/paint-calculators/',parent_id:'home-garden',state:'live'};
          const make=(id,name)=>({id,kind:'calculator',name,path:'/'+id+'/',parent_id:parent.id,state:'live'});
          const ceiling=make('ceiling-paint-calculator','Ceiling Paint Calculator');
          const room=make('room-paint-calculator','Room Paint Calculator');
          const desired=[ceiling,parent,room];
          const before=await read();
          console.log('Before:',JSON.stringify(before));
          assert.deepEqual(before,[parent],'Live preimage changed; no write');
          const sql="WITH wanted(id,name,path) AS (VALUES (?,?,?),(?,?,?)) INSERT INTO routes(id,kind,name,path,parent_id,state) SELECT id,'calculator',name,path,'paint-calculators','live' FROM wanted WHERE EXISTS(SELECT 1 FROM routes p WHERE p.id='paint-calculators' AND p.kind='subcategory' AND p.name='Paint Calculators' AND p.path='/paint-calculators/' AND p.parent_id='home-garden' AND p.state='live') AND NOT EXISTS(SELECT 1 FROM routes r JOIN wanted w ON w.id=r.id OR RTRIM(r.path,'/')=RTRIM(w.path,'/'))";
          const result=await req(path,{sql,params:[ceiling.id,ceiling.name,ceiling.path,room.id,room.name,room.path]});
          assert.equal(result[0]?.success,true,'Write outcome unconfirmed; inspect, do not retry');
          assert.equal(result[0]?.meta?.changes,2,'Unexpected affected rows; inspect, do not retry');
          const after=await read();
          assert.deepEqual(after,desired,'Unexpected route readback');
          console.log('After:',JSON.stringify(after));
          NODE
