name: HomeImprovement migration read-only inventory
on:
  push:
    branches: [work/homeimprovement-copy-prep-20261103]
    paths: [migration/homeimprovement/inventory.mjs, .github/workflows/homeimprovement-inventory.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect existing resources without mutations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node migration/homeimprovement/metadata-only.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: homeimprovement-readonly-inventory
          path: inventory.json
          retention-days: 7
