name: Home Improvement CMS Access - guarded change
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Apply private-path protection or roll back this workflow's Access app"
        required: true
        type: choice
        options:
          - apply
          - rollback
      confirmation:
        description: "Type APPLY_HI_ACCESS or ROLLBACK_HI_ACCESS exactly"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: homeimprovement-cms-access-change
  cancel-in-progress: false

jobs:
  protect:
    name: Guarded Cloudflare Access configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b81896777d206a2239625d9cf2e8a40b
      ACTION_OPERATION: ${{ inputs.operation }}
      ACTION_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure Access with safeguards
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const token=process.env.CLOUDFLARE_ACCESS_API_TOKEN;
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const operation=process.env.ACTION_OPERATION;
          const expected=operation==='apply'?'APPLY_HI_ACCESS':'ROLLBACK_HI_ACCESS';
          if(!['apply','rollback'].includes(operation)||process.env.ACTION_CONFIRMATION!==expected)
            throw new Error('Operation not confirmed. No changes made.');
          if(!token||!/^[a-f0-9]{32}$/i.test(account))
            throw new Error('Missing Access token or invalid account ID. No changes made.');
          const host='homeimprovement.tools';
          const appName='Home Improvement CMS - Owner Only';
          const privatePaths=['/admin','/admin/*','/cms','/cms/*','/api/editorial','/api/editorial/*'];
          const publicPaths=['/','/paint-calculator/','/feed.xml','/sitemap-blog.xml'];
          const privateProbes=['/admin','/cms','/api/editorial/session','/api/editorial/articles'];
          const base='/accounts/'+account+'/access/apps';
          async function api(method,path,body){
            const response=await fetch('https://api.cloudflare.com/client/v4'+path,{
              method,headers:{Authorization:'Bearer '+token,Accept:'application/json',...(body?{'Content-Type':'application/json'}:{})},
              ...(body?{body:JSON.stringify(body)}:{})
            });
            const data=await response.json().catch(()=>null);
            if(!response.ok||!data?.success)
              throw new Error('Cloudflare Access API '+method+' failed (HTTP '+response.status+').');
            return data;
          }
          async function probe(path){
            const response=await fetch('https://'+host+path,{
              method:'GET',redirect:'manual',cache:'no-store',
              headers:{'User-Agent':'HomeImprovement-Access-QA/1.0'}
            });
            return {status:response.status,location:response.headers.get('location')||''};
          }
          async function publicOkay(){
            for(const path of publicPaths){
              const r=await probe(path);
              if(r.status<200||r.status>=300)
                throw new Error('Public route failed health check: '+path+' (HTTP '+r.status+').');
            }
          }
          function behindAccess(r){
            if([401,403].includes(r.status))return true;
            if([301,302,303,307,308].includes(r.status))
              return /cloudflareaccess\.com|\/cdn-cgi\/access\//i.test(r.location);
            return false;
          }
          const page=await api('GET',base+'?per_page=100');
          if((page.result_info?.total_pages||1)>1)
            throw new Error('Access app list is paginated; refusing to modify an incomplete inventory.');
          const apps=page.result;
          if(!Array.isArray(apps))throw new Error('Invalid Access app list.');
          const uriHosts=(app)=>[app.domain,...(app.destinations||[]).map(d=>d.uri)]
            .filter(x=>typeof x==='string');
          const matchesHost=(v)=> {
            try{
              const u=new URL(v.startsWith('http')?v:'https://'+v);
              return u.hostname===host||u.hostname.endsWith('.'+host);
            }catch{return v.includes(host);}
          };
          const related=apps.filter(a=>uriHosts(a).some(matchesHost));
          const owned=apps.filter(a=>a.name===appName);
          if(operation==='rollback'){
            if(owned.length!==1||!uriHosts(owned[0]).some(matchesHost))
              throw new Error('Expected unique managed Access application not found. No changes made.');
            await api('DELETE',base+'/'+owned[0].id);
            console.log('Managed Access application rolled back. No article or cron changes.');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '## Home Improvement CMS Access\n\n- Action: rollback\n- Managed app removed: yes\n- Articles changed: 0\n');
            process.exit(0);
          }
          if(owned.length||related.length)
            throw new Error('Existing Access application overlaps site; manual review required. No changes made.');
          await publicOkay();
          const sessionBefore=await probe('/api/editorial/session');
          if(sessionBefore.status!==200)
            throw new Error('Editorial session baseline not 200; refusing potentially unsafe change.');
          const body={
            type:'self_hosted',name:appName,domain:host+'/admin',
            destinations:privatePaths.map(path=>({type:'public',uri:host+path})),
            policies:[{
              name:'Home Improvement - Alex only',decision:'allow',
              include:[{email:{email:'alex@avantybrands.com'}}]
            }],
            app_launcher_visible:false,
            session_duration:'24h'
          };
          const created=await api('POST',base,body);
          const id=created.result?.id;
          if(typeof id!=='string'||!id)
            throw new Error('Access app may have been created, but no ID was returned. Inspect manually.');
          let validated=false;
          try{
            for(let attempt=0;attempt<6;attempt++){
              await new Promise(resolve=>setTimeout(resolve,5000));
              let all=true;
              for(const path of privateProbes){
                const r=await probe(path);
                if(!behindAccess(r)){all=false;break;}
              }
              if(all){validated=true;break;}
            }
            if(!validated)
              throw new Error('Anonymous access was not blocked on all private routes.');
            await publicOkay();
          }catch(err){
            try{
              await api('DELETE',base+'/'+id);
              console.error('Post-change QA failed; managed Access app automatically rolled back.');
            }catch(rollbackError){
              console.error('URGENT: Automatic rollback failed. Open Cloudflare Access and inspect managed application.');
              throw rollbackError;
            }
            throw err;
          }
          console.log('Access app created. Anonymous private routes blocked; public routes still accessible.');
          console.log('Owner login, alternate hosts, cron and scheduled queues still require independent validation.');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## Home Improvement CMS Access\n\n'+
            '- Action: apply\n'+
            '- Anonymous access to private paths: blocked\n'+
            '- Public home, calculator, feed and sitemap: accessible\n'+
            '- Authorized user login: NOT YET TESTED\n'+
            '- Alternate worker host and scheduled jobs: NOT YET TESTED\n'+
            '- Articles changed: 0\n');
          NODE
