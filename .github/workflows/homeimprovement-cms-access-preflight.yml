name: Home Improvement CMS Access preflight
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homeimprovement-cms-access-preflight
  cancel-in-progress: false

jobs:
  inspect-access:
    name: Verify token and inspect Access (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b81896777d206a2239625d9cf2e8a40b
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify secret and Access API
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_ACCESS_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token) throw new Error('Missing repository secret CLOUDFLARE_ACCESS_API_TOKEN.');
          if (!/^[a-f0-9]{32}$/i.test(account)) throw new Error('Invalid Cloudflare account ID.');
          async function get(path) {
            const response = await fetch('https://api.cloudflare.com/client/v4' + path, {
              headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' },
            });
            const result = await response.json().catch(() => null);
            if (!response.ok || !result?.success) {
              throw new Error('Cloudflare read-only API check failed at ' + path.split('?')[0] +
                ' (HTTP ' + response.status + '). No resource was modified.');
            }
            return result.result;
          }
          const verified = await get('/user/tokens/verify');
          if (verified?.status !== 'active') {
            throw new Error('Cloudflare API token is not active. No resource was modified.');
          }
          const apps = await get('/accounts/' + account + '/access/apps?per_page=100');
          if (!Array.isArray(apps)) throw new Error('Unexpected Access app list response.');
          const target = 'homeimprovement.tools';
          const matches = apps.filter((app) => {
            const domains = [app.domain, ...(app.destinations || []).map(d => d.uri)]
              .filter(v => typeof v === 'string');
            return domains.some(v => {
              try {
                const uri = v.startsWith('http') ? new URL(v) : new URL('https://' + v);
                return uri.hostname === target || uri.hostname.endsWith('.' + target);
              } catch {
                return v.includes(target);
              }
            });
          });
          console.log('Cloudflare token is active and can read Access applications.');
          console.log('Access applications in account: ' + apps.length);
          console.log('Applications referencing Home Improvement host: ' + matches.length);
          console.log('Read-only preflight passed. No applications, policies, routes or content were changed.');
          const fs = await import('node:fs');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## Home Improvement CMS Access — preflight\n\n' +
            '- Token active: yes\n' +
            '- Access API read: yes\n' +
            '- Existing apps referencing site: ' + matches.length + '\n' +
            '- Changes made: none\n');
          NODE
