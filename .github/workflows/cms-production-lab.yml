name: Metricpedia CMS production — Ublong blog clone
on:
  push:
    branches: [work/metricpedia-cms-blog-v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metricpedia-editorial-production-lab
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cms
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b81896777d206a2239625d9cf2e8a40b
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node tests/production.mjs
      - run: node scripts/configure-production.mjs
      - run: npx wrangler deploy --config wrangler.production.json
      - run: node scripts/verify-production.mjs
