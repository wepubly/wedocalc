name: Metricpedia Editorial Lab (production)
on:
  push:
    branches: [work/metricpedia-cms-blog-v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metricpedia-editorial-production-lab
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cms
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b81896777d206a2239625d9cf2e8a40b
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node scripts/provision-production-lab.mjs
      - run: npx wrangler d1 migrations apply metricpedia-editorial-lab-db --remote --config wrangler.lab.json
      - run: npx wrangler deploy --config wrangler.lab.json
      - name: Verify live editor and anonymous API guardrails
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const origin=readFileSync('lab-origin.txt','utf8').trim();
          const r=await fetch(origin+'/admin/test-article');const html=await r.text();
          console.log('Editor check:',r.status,r.url,html.slice(0,300),'robots:',r.headers.get('x-robots-tag'));
          if(!r.ok||!html.includes('Criar matéria de teste')||!r.headers.get('x-robots-tag')?.includes('noindex'))throw Error('Editor unavailable/noindex missing');
          const bad=await fetch(origin+'/api/workbench/article',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
          if(bad.status!==400&&bad.status!==429)throw Error('Expected input validation or rate limit');
          const official=await fetch(origin+'/api/editorial/articles');if(official.status!==404)throw Error('Editorial administration unexpectedly exposed');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\nProduction editorial lab: '+origin+'/admin\nTEST ONLY publishing, isolated from official Pages and official blog.\n');
          NODE
